name: Deploy to Prod

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci
          npm --prefix functions ci

      # Deploying an untested build is how a broken bundle reaches goli.st.
      - name: Verify
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix functions run lint
          npm --prefix functions test

      - name: Build
        run: npm --prefix frontend run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Installed once and reused by both the rules test and the deploy below.
      # `--loglevel=error` hides the deprecation warnings npm prints for
      # firebase-tools' own transitive dependencies, which are not ours to fix
      # and drowned out the real output.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15 --no-fund --no-audit --loglevel=error

      - name: Test security rules
        run: npm run test:rules

      # Rules, indexes and functions were previously never deployed by CI at
      # all — only hosting was. They drifted from the repository and had to be
      # pushed by hand, which is exactly how a project ends up with no rules
      # under version control.
      #
      # The service account needs Firebase Admin plus Cloud Functions Developer
      # to deploy functions; the hosting-only account used below is not enough.
      - name: Authenticate for admin deploys
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOLIST_V2 }}

      # `--force` does two things here: it sets the Artifact Registry cleanup
      # policy (without it the deploy exits non-zero once images start piling
      # up), and it stops the CLI asking before removing functions that no
      # longer exist in index.js. The repository is the source of truth for
      # what is deployed, so a function deleted from source should leave prod.
      - name: Deploy rules, indexes and functions
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes,functions \
            --project golist-v2 \
            --non-interactive \
            --force

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"

      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOLIST_V2 }}
          projectId: golist-v2
          channelId: live
