<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f5f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b0b0d"
      media="(prefers-color-scheme: dark)"
    />
    <!--
      Paints the page background before the stylesheet arrives, so dark-mode
      visitors never see a white flash. Must match --canvas in src/index.css.
    -->
    <style>
      html { background: #f5f5f7; }
      @media (prefers-color-scheme: dark) { html { background: #0b0b0d; } }
    </style>

    <title>GoList</title>
    <meta
      name="description"
      content="Quickly browse a collection of links or files with one short URL."
    />

    <!--
      These are the defaults for pages the crawler reaches without a collection
      id. Collection pages get per-list tags injected server-side by the
      renderCollection function, so shared links preview properly.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GoList" />
    <meta property="og:title" content="GoList" />
    <meta
      property="og:description"
      content="Quickly browse a collection of links or files with one short URL."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
